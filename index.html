<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hashpage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a one-screen tool. Thin header with the link bar and size gauge, then editor | preview split (tabs on phones). The link carries semantic HTML only; the viewer owns the theme. */
:root {
  --bg: #eef1f6;
  --panel: #ffffff;
  --panel-2: #f6f8fb;
  --fg: #161c27;
  --muted: #5c677a;
  --line: #d3d9e3;
  --accent: #1f4fd8;
  --accent-fg: #ffffff;
  --ok: #1d8a4e;
  --warn: #b7791f;
  --bad: #c43d3d;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131b; --panel: #171c26; --panel-2: #1e2430; --fg: #e8ecf3; --muted: #93a0b5;
    --line: #2b3342; --accent: #6b8cff; --accent-fg: #0d1322; --ok: #4fc47f; --warn: #e0a84a; --bad: #ef6b6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131b; --panel: #171c26; --panel-2: #1e2430; --fg: #e8ecf3; --muted: #93a0b5;
  --line: #2b3342; --accent: #6b8cff; --accent-fg: #0d1322; --ok: #4fc47f; --warn: #e0a84a; --bad: #ef6b6b;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px;
  display: flex; flex-direction: column; overflow: hidden;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header {
  flex: none; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px;
}
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.brand .tag { color: var(--muted); font-size: 13px; }
.brand .repo { color: var(--muted); font-size: 13px; text-decoration: none; }
.brand .repo:hover { color: var(--accent); text-decoration: underline; }
.btn, .sel {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 6px 11px;
  font-size: 13px; font-weight: 500; line-height: 1.2; white-space: nowrap; text-decoration: none; color: var(--fg);
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover, .sel:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn input[type="file"] { display: none; }
.sel { padding-right: 8px; }
.sel span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.sel select { border: 0; background: transparent; padding: 0; cursor: pointer; }

.linkbar { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.linkbar label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.linkbar input {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px;
  padding: 7px 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); text-overflow: ellipsis;
}
.linkbar input:focus { color: var(--fg); }

.gauge { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.gauge .bar { grid-column: 1 / -1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.gauge .fill { height: 100%; width: 0; background: var(--ok); transition: width .2s, background .2s; }
.gauge .stats { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 14px; flex-wrap: wrap; }
.gauge .stats b { color: var(--fg); font-weight: 500; }
.gauge .verdict { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.gauge .verdict::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.verdict.ok { color: var(--ok); } .verdict.warn { color: var(--warn); } .verdict.bad { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { .gauge .fill { transition: none; } }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.pane + .pane { border-left: 1px solid var(--line); }
.pane-head {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 6px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600;
  background: var(--panel-2); border-bottom: 1px solid var(--line);
}
.pane-head .btn { text-transform: none; letter-spacing: 0; font-weight: 500; padding: 3px 8px; font-size: 12px; }
.pane-head .stripped { color: var(--warn); }
#editor {
  flex: 1; width: 100%; min-height: 0; resize: none; border: 0; outline: none; background: var(--panel); color: var(--fg);
  font-family: var(--mono); font-size: 13px; line-height: 1.55; padding: 14px 16px; tab-size: 2; white-space: pre; overflow: auto;
}
#editor:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
#preview { flex: 1; width: 100%; min-height: 0; border: 0; background: #ffffff; }

.tabs { display: none; }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; }
  .pane { display: none; }
  .pane.active { display: flex; }
  .pane + .pane { border-left: 0; }
  .tabs { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .tabs button { flex: 1; border: 0; background: var(--panel-2); padding: 7px 0; font-size: 13px; font-weight: 500; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
  .linkbar { grid-template-columns: 1fr auto; }
  .linkbar label { display: none; }
  .brand .tag { display: none; }
}

body.reader header, body.reader .tabs { display: none; }
body.reader main { grid-template-columns: 1fr; }
body.reader #editPane { display: none; }
body.reader #previewPane { display: flex; }
body.reader #previewPane .pane-head { display: none; }
#readerBar {
  display: none; position: fixed; gap: 8px; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
}
#readerBar .btn, #readerBar .sel { box-shadow: 0 4px 14px rgba(0,0,0,.25); background: var(--panel); }
#readerBar .btn.primary { background: var(--accent); }
body.reader #readerBar { display: flex; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
  opacity: 0; pointer-events: none; transition: opacity .15s;
}
.toast.show { opacity: 1; }
</style>

<header>
  <div class="row">
    <div class="brand"><h1>Hashpage</h1><span class="tag">The link carries meaning. Your client carries the look.</span><a class="repo" href="https://github.com/zmeyer44/hashpage" target="_blank" rel="noopener">GitHub</a></div>
    <label class="sel"><span>Theme</span><select id="themeSel" aria-label="Viewer theme"></select></label>
    <button class="btn" id="newBtn" type="button">New</button>
    <label class="btn">Open file<input type="file" id="fileIn" accept=".html,.htm,text/html"></label>
    <a class="btn" id="openBtn" href="#" target="_blank" rel="noopener">Open in tab</a>
    <button class="btn" id="copyReader" type="button">Copy reader link</button>
    <button class="btn primary" id="copyEdit" type="button">Copy edit link</button>
  </div>
  <div class="linkbar">
    <label for="linkOut">Link</label>
    <input id="linkOut" readonly spellcheck="false" aria-label="Current link">
    <button class="btn" id="copyLink" type="button">Copy</button>
  </div>
  <div class="gauge">
    <div class="stats">
      <span>HTML <b id="sHtml">0</b> B</span>
      <span>deflated <b id="sZip">0</b> B</span>
      <span>link <b id="sUrl">0</b> chars</span>
    </div>
    <span class="verdict ok" id="verdict">fits anywhere</span>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" aria-selected="true" data-tab="editPane">Edit</button>
    <button type="button" role="tab" aria-selected="false" data-tab="previewPane">Preview</button>
  </div>
</header>

<main>
  <section class="pane active" id="editPane">
    <div class="pane-head"><span>Semantic HTML <span id="strippedNote" class="stripped"></span></span><button class="btn" id="copyHtml" type="button">Copy HTML</button></div>
    <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="HTML source"></textarea>
  </section>
  <section class="pane" id="previewPane">
    <div class="pane-head"><span>Preview</span><span id="themeNote">theme is yours, not in the link</span></div>
    <iframe id="preview" sandbox="allow-popups" title="Rendered page"></iframe>
  </section>
</main>
<div id="readerBar">
  <label class="sel"><span>Theme</span><select id="themeSel2" aria-label="Viewer theme"></select></label>
  <button class="btn primary" id="readerEdit" type="button">Edit this page</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const editor = $('editor'), preview = $('preview'), linkOut = $('linkOut'), toast = $('toast');

  // ---- encoding: utf8 -> deflate-raw -> base64url. Prefix tells the loader how to read it.
  // z. = deflated, opens in the editor   v. = deflated, opens in reader mode   t. = uncompressed (fallback)
  const enc = new TextEncoder(), dec = new TextDecoder();
  const hasZip = typeof CompressionStream === 'function';

  async function deflate(str) {
    const cs = new CompressionStream('deflate-raw');
    const w = cs.writable.getWriter(); w.write(enc.encode(str)); w.close();
    return new Uint8Array(await new Response(cs.readable).arrayBuffer());
  }
  async function inflate(bytes) {
    const ds = new DecompressionStream('deflate-raw');
    const w = ds.writable.getWriter(); w.write(bytes); w.close();
    return dec.decode(await new Response(ds.readable).arrayBuffer());
  }
  function b64u(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function unb64u(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const bin = atob(s), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function encode(html, reader) {
    if (hasZip) return (reader ? 'v.' : 'z.') + b64u(await deflate(html));
    return 't.' + b64u(enc.encode(html));
  }
  async function decode(hash) {
    const m = /^#?([zvt])\.([A-Za-z0-9_-]+)$/.exec(hash || '');
    if (!m) return null;
    const bytes = unb64u(m[2]);
    const html = m[1] === 't' ? dec.decode(bytes) : await inflate(bytes);
    return { html, reader: m[1] === 'v' };
  }

  // ---- the contract: only semantics travel. Presentation and behavior are stripped before encoding.
  const DROP_TAGS = ['style', 'script', 'link', 'iframe', 'object', 'embed', 'template', 'noscript', 'svg', 'canvas', 'font', 'center'];
  const DROP_ATTRS = ['style', 'class', 'width', 'height', 'bgcolor', 'color', 'align', 'valign', 'border', 'cellpadding', 'cellspacing', 'face', 'size'];
  function sanitize(src) {
    const doc = new DOMParser().parseFromString(src, 'text/html');
    let stripped = 0;
    doc.querySelectorAll(DROP_TAGS.join(',')).forEach((el) => { el.remove(); stripped++; });
    doc.querySelectorAll('*').forEach((el) => {
      for (const a of Array.from(el.attributes)) {
        const n = a.name.toLowerCase();
        if (n.startsWith('on') || DROP_ATTRS.includes(n) || ((n === 'href' || n === 'src') && /^\s*javascript:/i.test(a.value))) { el.removeAttribute(a.name); stripped++; }
      }
    });
    const title = doc.title ? '<title>' + doc.title.replace(/</g, '&lt;') + '</title>\n' : '';
    return { html: title + doc.body.innerHTML.trim() + '\n', stripped };
  }

  // ---- viewer themes. Each styles bare elements only; none knows anything about the document it is rendering.
  const THEMES = {
    reader: { name: 'Reader', css: `

p, ul, ol, dl, table, figure, blockquote, pre, details { margin: 0 0 1.1em; }

th, td { text-align: left; padding: .45em .5em .45em 0; border-bottom: 1px solid #d8d2c3; vertical-align: top; }
th { font-weight: 600; } td:last-child, th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
tfoot td { border-bottom: 0; font-weight: 600; }

code, kbd, samp { font: .88em/1.4 "SF Mono", Menlo, Consolas, monospace; } kbd { border: 1px solid #c9c2b2; border-bottom-width: 2px; border-radius: 3px; padding: 0 .35em; }

    newsprint: { name: 'Newsprint', css: `

h2 { font-size: 1.35rem; font-weight: 700; margin: 1.8em 0 .4em; border-top: 1px solid #1a1a1a; padding-top: .4em; }
h3 { font-size: 1.05rem; font-weight: 700; font-style: italic; margin: 1.4em 0 .3em; }
header > p { font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; margin: 0 0 1.6em; }
article > p:first-of-type::first-letter, section:first-of-type > p:first-of-type::first-letter { float: left; font-size: 3.4em; line-height: .8; padding: .08em .1em 0 0; font-weight: 700; }
footer { margin-top: 3rem; border-top: 1px solid #1a1a1a; padding-top: .6rem; font-size: .85rem; }
a { color: #1a1a1a; } p { text-align: justify; margin: 0 0 1em; }
ul, ol, dl, table, figure, blockquote, pre, details, aside { margin: 0 0 1.2em; }
blockquote { margin: 1.2em 1.5em; font-size: 1.15em; font-style: italic; text-align: center; border-top: 1px solid #1a1a1a; border-bottom: 1px solid #1a1a1a; padding: .6em 0; }
figcaption, cite { font-size: .8rem; font-style: normal; text-transform: uppercase; letter-spacing: .08em; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; border-top: 2px solid #1a1a1a; border-bottom: 2px solid #1a1a1a; }
th, td { text-align: left; padding: .35em .4em; border-bottom: 1px solid #b9b3a4; vertical-align: top; } th { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; }
td:last-child, th:last-child { text-align: right; font-variant-numeric: tabular-nums; } tfoot td { border-bottom: 0; font-weight: 700; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: .2em 1.2em; font-size: .95rem; } dt { font-weight: 700; } dd { margin: 0; }
aside { border: 1px solid #1a1a1a; padding: .7rem .9rem; font-size: .92rem; background: #ece7d9; }
details { border-top: 1px solid #1a1a1a; border-bottom: 1px solid #1a1a1a; padding: .5rem 0; } summary { cursor: pointer; font-weight: 700; }
pre { background: #ece7d9; padding: .75rem; overflow-x: auto; font-size: .85rem; } code, kbd, samp { font: .88em "Courier New", Courier, monospace; } kbd { border: 1px solid #1a1a1a; padding: 0 .25em; }
mark { background: #e4d58a; } hr { border: 0; border-top: 1px solid #1a1a1a; margin: 1.5rem 0; } hr::after { content: "\\2042"; display: block; text-align: center; margin-top: -.75em; background: #f4f1e8; width: 3ch; margin-left: auto; margin-right: auto; }
small { font-size: .8rem; } address { font-style: normal; } img { max-width: 100%; filter: grayscale(1); }
meter, progress { width: 100%; } nav ul { list-style: none; padding: 0; display: flex; gap: 1.2rem; flex-wrap: wrap; font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; }
button, input, select, textarea { font: inherit; border: 1px solid #1a1a1a; background: #fff; }
` },
    none: { name: 'Browser default', css: '' }
  };
  const THEME_KEY = 'hashpage.theme';
  let theme = 'reader';
  try { const t = localStorage.getItem(THEME_KEY); if (t && THEMES[t]) theme = t; } catch (e) { /* ignore */ }

  // ---- starter document: nothing but semantics; every theme has to render it well.
  const STARTER = `<title>Hashpage</title>
<article>
  <header>
    <h1>Hashpage</h1>
    <p>A document format where the link is the document and the reader owns the look. <time datetime="2026-10-14">Last edited October 14, 2026</time>.</p>
    <nav>
      <ul>
        <li><a href="#how">How it works</a></li>
        <li><a href="#vocab">Vocabulary</a></li>
        <li><a href="#themes">Themes</a></li>
        <li><a href="#limits">Limits</a></li>
        <li><a href="#faq">FAQ</a></li>
      </ul>
    </nav>
  </header>

  <p><strong>Hashpage</strong> is a way of publishing a small page without a server. The page is written in plain <em>semantic HTML</em>, compressed, and placed after the <code>#</code> in a URL. Anyone who has the link has the page. No account, no upload, nothing stored anywhere except in the link itself.</p>

  <aside>This article is itself a Hashpage. The text you are reading, and its structure, are the only things in the link. The typeface, colors and layout came from the client you opened it in. Change the theme and this page changes with it.</aside>

  <section id="how">
    <h2>How it works</h2>
    <p>A Hashpage link has three parts: the address of a client, a <code>#</code>, and a payload. The payload is the document, encoded so it survives being pasted anywhere a URL can go.</p>
    <ol>
      <li>The author writes semantic HTML. Styles, scripts and classes are dropped before encoding.</li>
      <li>The HTML is compressed with <code>deflate</code>, the same algorithm inside gzip and PNG.</li>
      <li>The bytes are written as base64url, an alphabet of letters, digits, <code>-</code> and <code>_</code> that needs no escaping.</li>
      <li>A two-character prefix tells the client how to open it.</li>
    </ol>
    <pre>https://example.org/hashpage#z.yXZbBattAEIbv~xQLPRTMxtS...</pre>
    <dl>
      <dt><code>z.</code></dt><dd>Deflated. Opens in the editor.</dd>
      <dt><code>v.</code></dt><dd>Deflated. Opens in reader mode, full page.</dd>
      <dt><code>t.</code></dt><dd>Uncompressed. Fallback for clients without a deflate implementation.</dd>
    </dl>
    <p>Everything after <code>#</code> is a <dfn>fragment</dfn>. Browsers never send the fragment to the server, so the client's host sees only that a page was opened, never what was in it.</p>
  </section>

  <section id="vocab">
    <h2>Vocabulary</h2>
    <p>Because the link carries no presentation, the set of elements an author may use <em>is</em> the format. Clients promise to render all of them well. Authors promise to use them for what they mean.</p>
    <table>
      <thead><tr><th>Element</th><th>Use it for</th></tr></thead>
      <tbody>
        <tr><td><code>article</code>, <code>section</code></td><td>The document and its parts</td></tr>
        <tr><td><code>header</code>, <code>footer</code>, <code>nav</code></td><td>Title block, colophon, table of contents</td></tr>
        <tr><td><code>h1</code> to <code>h4</code></td><td>Headings, nested in order</td></tr>
        <tr><td><code>p</code>, <code>ul</code>, <code>ol</code>, <code>dl</code></td><td>Prose, lists, key and value pairs</td></tr>
        <tr><td><code>table</code> with <code>thead</code>, <code>tfoot</code></td><td>Anything that is really a grid</td></tr>
        <tr><td><code>aside</code></td><td>A note beside the main text</td></tr>
        <tr><td><code>details</code>, <code>summary</code></td><td>Something the reader can open</td></tr>
        <tr><td><code>figure</code>, <code>blockquote</code>, <code>cite</code></td><td>Quotations and captioned things</td></tr>
        <tr><td><code>time</code>, <code>address</code>, <code>meter</code></td><td>Dates, places, a value in a range</td></tr>
        <tr><td><code>mark</code>, <code>kbd</code>, <code>code</code>, <code>dfn</code></td><td>Highlights, keys, code, defined terms</td></tr>
      </tbody>
    </table>
    <p>Attributes that carry meaning stay: <code>href</code>, <code>datetime</code>, <code>id</code>, <code>data-*</code>. Attributes that carry looks go: <code>style</code>, <code>class</code>, <code>align</code>, <code>width</code>.</p>
  </section>

  <section id="themes">
    <h2>Themes</h2>
    <p>A theme is a short stylesheet that styles bare elements and knows nothing about any particular document. The reader picks one once; the choice is kept on their device and never enters a link. Two people opening the same link may see two different pages, and both are correct.</p>
    <dl>
      <dt>Reader</dt><dd>Book typography on paper. Follows the system light or dark setting.</dd>
      <dt>Terminal</dt><dd>Monospace on black. Headings become <code>#</code> lines, links get brackets, quotes get a <code>&gt;</code>.</dd>
      <dt>Brutalist</dt><dd>Black rules, hard shadows, one yellow.</dd>
      <dt>Newsprint</dt><dd>Double rules, a drop cap, justified columns of type.</dd>
      <dt>Browser default</dt><dd>No stylesheet at all. The proof that the document stands on its own.</dd>
    </dl>
    <figure>
      <blockquote><p>Markdown won because you could not style it. Semantic HTML is Markdown with a real vocabulary.</p></blockquote>
      <figcaption><cite>From the design notes</cite></figcaption>
    </figure>
  </section>

  <section id="limits">
    <h2>Limits</h2>
    <p>A link can only be so long before something along the way cuts it. Hashpage shows a running count and a verdict while you write.</p>
    <table>
      <thead><tr><th>Link length</th><th>Where it survives</th></tr></thead>
      <tbody>
        <tr><td>Up to 2,000 characters</td><td>Anywhere, including SMS and old browsers</td></tr>
        <tr><td>Up to 8,000</td><td>Chat apps, email, most forms</td></tr>
        <tr><td>Up to 32,000</td><td>Modern browsers; some apps truncate</td></tr>
        <tr><td>Beyond that</td><td>Not reliably</td></tr>
      </tbody>
    </table>
    <p>This article uses about <meter min="0" max="8000" value="3900">half</meter> of the chat-safe budget.</p>
    <ul>
      <li>No images, audio or video. They do not fit.</li>
      <li>No scripts. A link should not be able to run code on the reader's machine.</li>
      <li>No live collaboration. Sharing a link hands over a copy; edits make a new link.</li>
    </ul>
  </section>

  <section id="faq">
    <h2>Frequently asked questions</h2>
    <details>
      <summary>Is it private?</summary>
      <p>The content never reaches a server, but anything that logs URLs sees it: browser history, chat logs, link previews. Treat a Hashpage link the way you would treat the text itself.</p>
    </details>
    <details>
      <summary>Can a page link to another page?</summary>
      <p>Yes. A Hashpage link is an ordinary <code>href</code>. Pages can embed pages by reference, which is how a small wiki like this one could grow.</p>
    </details>
    <details>
      <summary>What happens if the client goes away?</summary>
      <p>The link still contains the document. Any client that speaks the format can open it, and the format is small enough to reimplement in an afternoon.</p>
    </details>
    <details>
      <summary>How do I edit this?</summary>
      <p>Press <kbd>Edit this page</kbd>. You get your own copy; the link you came from is unchanged.</p>
    </details>
  </section>

  <footer>
    <p><small>Hashpage follows the link-is-the-document idea from <a href="https://tinylittleoffice.com">Tiny Little Office</a>. This page is an example and may be edited by anyone who holds it.</small></p>
  </footer>
</article>
`;

  // ---- state
  let html = '', timer = null, lastHash = '';

  function baseUrl() { return location.href.split('#')[0]; }

  function render() {
    const t = THEMES[theme] || THEMES.reader;
    preview.srcdoc = '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>' + t.css + '</style>' + html;
  }

  async function sync() {
    const frag = await encode(html, false);
    lastHash = frag;
    try { history.replaceState(null, '', '#' + frag); } catch (e) { /* ignore */ }
    const url = baseUrl() + '#' + frag;
    linkOut.value = url;
    $('openBtn').href = url;
    const htmlBytes = enc.encode(html).length;
    const zipBytes = Math.floor((frag.length - 2) * 3 / 4);
    $('sHtml').textContent = htmlBytes.toLocaleString();
    $('sZip').textContent = zipBytes.toLocaleString();
    $('sUrl').textContent = url.length.toLocaleString();
    const v = $('verdict'), fill = $('fill');
    let cls, text, pct;
    if (url.length <= 2000)       { cls = 'ok';   text = 'fits anywhere, even SMS';            pct = url.length / 2000 * 25; }
    else if (url.length <= 8000)  { cls = 'ok';   text = 'fine for chat apps and email';       pct = 25 + (url.length - 2000) / 6000 * 25; }
    else if (url.length <= 32000) { cls = 'warn'; text = 'browsers only; some apps truncate';  pct = 50 + (url.length - 8000) / 24000 * 25; }
    else                          { cls = 'bad';  text = 'may not survive sharing';            pct = Math.min(100, 75 + (url.length - 32000) / 64000 * 25); }
    v.className = 'verdict ' + cls; v.textContent = text;
    fill.style.width = pct + '%';
    fill.style.background = 'var(--' + cls + ')';
  }

  function applySource(src, replaceEditor) {
    const r = sanitize(src);
    html = r.html;
    $('strippedNote').textContent = r.stripped ? '· ' + r.stripped + ' presentational ' + (r.stripped === 1 ? 'thing' : 'things') + ' dropped' : '';
    if (replaceEditor) editor.value = html;
    render();
    sync();
  }

  function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(showToast.t); showToast.t = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  async function copyText(text, label) {
    try {
      await navigator.clipboard.writeText(text);
      showToast(label + ' copied');
    } catch (e) {
      linkOut.value = text; linkOut.focus(); linkOut.select();
      showToast('Select the link bar and copy');
    }
  }

  // ---- themes
  function setTheme(t) {
    theme = THEMES[t] ? t : 'reader';
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* ignore */ }
    [$('themeSel'), $('themeSel2')].forEach((s) => { s.value = theme; });
    render();
  }
  [$('themeSel'), $('themeSel2')].forEach((s) => {
    for (const k in THEMES) { const o = document.createElement('option'); o.value = k; o.textContent = THEMES[k].name; s.appendChild(o); }
    s.value = theme;
    s.addEventListener('change', () => setTheme(s.value));
  });

  // ---- editor
  editor.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => applySource(editor.value, false), 220);
  });
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = editor.selectionStart, t = editor.selectionEnd;
      editor.setRangeText('  ', s, t, 'end');
      editor.dispatchEvent(new Event('input'));
    }
  });

  // ---- buttons
  $('copyEdit').addEventListener('click', async () => copyText(baseUrl() + '#' + await encode(html, false), 'Edit link'));
  $('copyReader').addEventListener('click', async () => copyText(baseUrl() + '#' + await encode(html, true), 'Reader link'));
  $('copyLink').addEventListener('click', () => copyText(linkOut.value, 'Link'));
  $('copyHtml').addEventListener('click', () => copyText(html, 'HTML'));
  $('newBtn').addEventListener('click', () => {
    applySource('<title>Untitled</title>\n<article>\n  <header>\n    <h1>Hello</h1>\n    <p><time datetime="2026-10-14">Today</time></p>\n  </header>\n  <p>Write semantic HTML on the left. Headings, lists, tables, <code>dl</code>, <code>details</code>, <code>aside</code>, <code>figure</code>, <code>mark</code>, <code>time</code>, <code>meter</code>. Styles and scripts are dropped before the link is made.</p>\n</article>\n', true);
    editor.focus();
  });
  $('fileIn').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { applySource(String(r.result), true); showToast('Loaded ' + f.name); };
    r.readAsText(f);
    e.target.value = '';
  });
  $('readerEdit').addEventListener('click', () => {
    document.body.classList.remove('reader');
    sync();
  });
  linkOut.addEventListener('focus', () => linkOut.select());

  // mobile tabs
  document.querySelectorAll('.tabs [role="tab"]').forEach((b) => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.tabs [role="tab"]').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
      document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('active', p.id === b.dataset.tab));
    });
  });

  // ---- boot: read the hash, or start with the sample.
  async function boot() {
    if (!hasZip) $('themeNote').textContent = 'theme is yours, not in the link · no compression in this browser';
    let loaded = null;
    try { loaded = await decode(location.hash); } catch (e) { loaded = null; }
    if (loaded) {
      if (loaded.reader) document.body.classList.add('reader');
      applySource(loaded.html, true);
    } else {
      if (location.hash && location.hash.length > 1) showToast('Could not read that link; starting fresh');
      applySource(STARTER, true);
    }
  }
  window.addEventListener('hashchange', async () => {
    const h = location.hash.replace(/^#/, '');
    if (h === lastHash) return;
    try { const l = await decode(h); if (l) { if (l.reader) document.body.classList.add('reader'); applySource(l.html, true); } } catch (e) { /* ignore */ }
  });
  boot();
})();
</script>
